[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonflex"
version = "0.1.0"
description = "Carbon intensity, marginal emissions and carbon-aware flexibility on public German grid data"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "pandas>=2.1", "scipy", "scikit-learn", "matplotlib", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
